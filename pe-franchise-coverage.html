<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PE-网点区域分布</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #eef3f7;
      --paper: #ffffff;
      --ink: #12283f;
      --muted: #66788c;
      --line: #d7e1ea;
      --soft: #f5f8fb;
      --accent: #3f6684;
      --shadow: 0 14px 28px rgba(42,74,102,.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7fafc 0, #edf3f7 100%);
    }
    .shell { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(420px, 1fr);
      gap: 10px;
      align-items: start;
    }
    .titlebox {
      padding: 12px 14px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, #4b6f8a 0, #6a90aa 100%);
      box-shadow: 0 6px 14px rgba(52,86,112,.10);
    }
    .eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .78; }
    .page-title { margin: 6px 0 4px; font-size: 24px; line-height: 1.05; }
    .page-subtitle { margin: 0; font-size: 12px; line-height: 1.5; color: rgba(255,255,255,.84); }
    .control-stack { display: grid; gap: 8px; align-content: start; }
    .legend, .group, .stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(16,37,61,.05);
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 10px;
      background: var(--soft);
    }
    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid #d7e1ea;
      border-radius: 999px;
      font-size: 12px;
      color: #486072;
      background: #fff;
      white-space: nowrap;
    }
    .legend-chip input { margin: 0; }
    .sw-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      flex-wrap: wrap;
    }
    .group strong { font-size: 12px; }
    .group label { font-size: 12px; color: #31465b; display: inline-flex; align-items: center; gap: 6px; }
    .group button {
      border: 1px solid #cfd9e3;
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
    }
    .search-input {
      border: 1px solid #cfd9e3;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      min-width: 240px;
      width: 240px;
    }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 10px 12px 9px; min-height: 72px; }
    .stat .k { font-size: 11px; color: var(--muted); }
    .stat .v { margin-top: 3px; font-size: 18px; font-weight: 800; color: var(--accent); }
    .main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 8px; padding: 8px; }
    .map-card, .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); }
    #map { min-height: 840px; height: 100%; }
    .panel-head { padding: 12px 14px 10px; border-bottom: 1px solid #e5edf3; display: flex; justify-content: space-between; gap: 10px; }
    .panel-copy { border: 1px solid #cfd9e3; background: #fff; color: var(--ink); border-radius: 10px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .panel-head h2 { margin: 0; font-size: 16px; }
    .panel-head p { margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .panel-body { padding: 12px; overflow: auto; max-height: calc(100vh - 166px); background: #f8fbfd; }
    .detail-card { padding: 12px; border: 1px solid #dce5ee; border-radius: 16px; background: #fff; margin-bottom: 10px; }
    .detail-card h3 { margin: 0 0 8px; font-size: 15px; }
    .detail-row { font-size: 12px; color: #41576c; line-height: 1.55; }
    .selected-list { display: grid; gap: 8px; }
    .selected-item { padding: 10px 11px; border: 1px solid #dce5ee; border-radius: 14px; background: #fff; }
    .selected-item strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .selected-meta { font-size: 12px; color: #41576c; line-height: 1.5; }
    .leaflet-div-icon { background: transparent; border: none; }
    .radar { width: 18px; height: 18px; border: 2px solid currentColor; background: currentColor; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,.9); }
    .leaflet-tooltip.city-label { background: rgba(255,255,255,.96); color: var(--ink); border: 1px solid #d7e1ea; border-radius: 10px; box-shadow: 0 8px 18px rgba(15,39,64,.10); font-size: 11px; font-weight: 700; padding: 2px 6px; }
    .leaflet-tooltip.city-label::before { display: none; }
    @media (max-width: 1380px) {
      .toolbar { grid-template-columns: 1fr; }
      .main { grid-template-columns: 1fr; }
      #map { min-height: 640px; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 760px) {
      .topbar { padding: 8px; }
      .page-title { font-size: 24px; }
      .main { padding: 8px; }
      #map { min-height: 64vh; height: 64vh; }
      .panel { max-height: 34vh; }
      .panel-body { max-height: calc(34vh - 64px); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="toolbar">
        <div class="titlebox">
          <div class="eyebrow">PE Franchise Coverage</div>
          <h1 class="page-title">PE-网点区域分布</h1>
          <p class="page-subtitle">按最新网点-行政区表绘制覆盖范围。点击任一网点后，高亮其负责辖区并查看区划与人口详情。</p>
        </div>
        <div class="control-stack">
          <div class="legend" id="legend"></div>
          <div class="group">
            <strong>显示</strong>
            <label><input type="checkbox" id="toggleLabels" checked>标签</label>
            <input type="text" id="searchInput" class="search-input" placeholder="搜索行政区或网点">
            <button type="button" id="resetViewBtn">重置视图</button>
          </div>
          <div class="stats">
            <div class="stat"><div class="k">可见网点</div><div class="v" id="visibleNodeCount">0</div></div>
            <div class="stat"><div class="k">网点总数</div><div class="v" id="totalNodeCount">0</div></div>
            <div class="stat"><div class="k">覆盖行政区</div><div class="v" id="coverageCount">0</div></div>
            <div class="stat"><div class="k">当前选中</div><div class="v" id="currentNodeName">未选择</div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="main">
      <section class="map-card"><div id="map"></div></section>
      <aside class="panel">
        <div class="panel-head">
          <div>
            <h2>网点覆盖详情</h2>
            <p>点击地图中的网点点位后，高亮其覆盖行政区，并在右侧查看辖区与人口。</p>
          </div>
          <button type="button" class="panel-copy" id="copyDetailBtn">复制详情</button>
        </div>
        <div class="panel-body">
          <div class="detail-card" id="detailCard"></div>
          <div class="selected-list" id="coverageList"></div>
        </div>
      </aside>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
    const zoneColors = {"CALLAO":"#d44a36","LIMA北":"#2d7dd2","LIMA东":"#1f9d8b","LIMA西":"#7a9e2f","LIMA南":"#8b5cf6"};
    const zoneOrder = {"CALLAO":0,"LIMA北":1,"LIMA东":2,"LIMA西":3,"LIMA南":4};
    const legend = document.getElementById('legend');
    legend.innerHTML = Object.entries(zoneColors).map(([zone, color]) => `<label class="legend-chip"><input type="checkbox" data-zone value="${zone}" checked><i class="sw-dot" style="background:${color}"></i>${zone}</label>`).join('');

    Promise.all([
      fetch('./pe-franchise-coverage.data.json').then(r => r.json()),
      fetch('https://cdn.jsdelivr.net/npm/pe-atlas@0.0.1/districts-100k.json').then(r => r.json()),
    ]).then(([data, topo]) => {
      const districts = topojson.feature(topo, topo.objects.districts).features;
      const districtById = new Map(districts.map(f => [String(f.id), f]));
      const metaById = data.district_meta;
      const nodesById = new Map(data.nodes.map(n => [n.id, n]));
      const coverageByNode = new Map();
      data.nodes.forEach(node => coverageByNode.set(node.id, node.members.map(id => districtById.get(String(id))).filter(Boolean)));

      const map = L.map('map', { zoomControl: true, dragging: true, scrollWheelZoom: true }).setView([-12.04, -77.03], 10);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(map);
      const nodesLayer = L.layerGroup().addTo(map);
      const labelsLayer = L.layerGroup().addTo(map);
      const coverageLayer = L.layerGroup().addTo(map);
      const nodeLayers = {};
      const nodeLabelLayers = {};
      let activeNodeId = null;

      function radarIcon(color) {
        return L.divIcon({ html: `<div class="radar" style="color:${color}"></div>`, iconSize: [24,24], iconAnchor: [12,12] });
      }
      function normalize(text) { return (text || '').toString().toLowerCase(); }
      function activeZones() { return new Set(Array.from(document.querySelectorAll('input[data-zone]:checked')).map(el => el.value)); }
      function activeQuery() { return normalize(document.getElementById('searchInput').value.trim()); }
      function setEmptyDetail() {
        document.getElementById('currentNodeName').textContent = '未选择';
        document.getElementById('detailCard').innerHTML = '<h3>未选择</h3><div class="detail-row">点击地图上的网点点位，查看该网点覆盖的行政区。</div>';
        document.getElementById('coverageList').innerHTML = '<div class="detail-row">当前还没有选中的网点。</div>';
      }
      function updateSidebar(node) {
        const members = (coverageByNode.get(node.id) || []).slice().sort((a,b) => (metaById[String(b.id)]?.population || 0) - (metaById[String(a.id)]?.population || 0));
        document.getElementById('currentNodeName').textContent = node.code;
        document.getElementById('detailCard').innerHTML = `
          <h3>${node.code}</h3>
          <div class="detail-row">主分区：${node.main_zone}</div>
          <div class="detail-row">覆盖分区：${node.zones.join(' / ')}</div>
          <div class="detail-row">覆盖行政区：${node.district_count}</div>
          <div class="detail-row">覆盖人口：${node.coverage_population.toLocaleString('en-US')}</div>
        `;
        document.getElementById('coverageList').innerHTML = members.map(feature => {
          const meta = metaById[String(feature.id)] || {};
          return `
            <div class="selected-item">
              <strong>${meta.district_cn || feature.properties.name || feature.id} (${feature.id})</strong>
              <div class="selected-meta">分区：${meta.zone || node.main_zone}</div>
              <div class="selected-meta">所属省/市：${meta.province_cn || '-'} / ${meta.department_cn || '-'}</div>
              <div class="selected-meta">人口：${(meta.population || 0).toLocaleString('en-US')}</div>
            </div>
          `;
        }).join('');
      }
      function renderCoverage() {
        coverageLayer.clearLayers();
        if (!activeNodeId) { setEmptyDetail(); return null; }
        const node = nodesById.get(activeNodeId);
        const features = coverageByNode.get(activeNodeId) || [];
        if (!node || !features.length) { setEmptyDetail(); return null; }
        const layer = L.geoJSON({ type: 'FeatureCollection', features }, {
          style: feature => {
            const meta = metaById[String(feature.id)] || {};
            const zone = meta.zone || node.main_zone;
            return { color: zoneColors[zone] || '#d97a2b', weight: 1, opacity: 1, fillColor: zoneColors[zone] || '#efc1b3', fillOpacity: 0.48 };
          },
          onEachFeature: (feature, lyr) => {
            const meta = metaById[String(feature.id)] || {};
            lyr.bindPopup(`
              <div style="font-weight:700;margin-bottom:6px;">${meta.district_cn || feature.properties.name || feature.id}</div>
              <div style="font-size:12px;line-height:1.5;">UBIGEO：${feature.id}</div>
              <div style="font-size:12px;line-height:1.5;">分区：${meta.zone || node.main_zone}</div>
              <div style="font-size:12px;line-height:1.5;">省/市：${meta.province_cn || '-'} / ${meta.department_cn || '-'}</div>
              <div style="font-size:12px;line-height:1.5;">人口：${(meta.population || 0).toLocaleString('en-US')}</div>
            `);
          }
        }).addTo(coverageLayer);
        updateSidebar(node);
        return layer.getBounds();
      }
      function buildCopyText() {
        if (!activeNodeId) return '当前没有选中的网点。';
        const node = nodesById.get(activeNodeId);
        const members = (coverageByNode.get(activeNodeId) || []).slice().sort((a,b) => (metaById[String(b.id)]?.population || 0) - (metaById[String(a.id)]?.population || 0));
        const lines = [
          `网点：${node.code}`,
          `主分区：${node.main_zone}`,
          `覆盖分区：${node.zones.join(' / ')}`,
          `覆盖行政区：${node.district_count}`,
          `覆盖人口：${node.coverage_population.toLocaleString('en-US')}`,
          '',
          '覆盖明细：',
          ...members.map(feature => {
            const meta = metaById[String(feature.id)] || {};
            return `- ${meta.district_cn || feature.properties.name || feature.id} (${feature.id}) / ${meta.zone || node.main_zone} / ${meta.province_cn || '-'} / ${meta.department_cn || '-'} / 人口 ${((meta.population || 0).toLocaleString('en-US'))}`;
          })
        ];
        return lines.join('\n');
      }
      function refresh(fit = false) {
        nodesLayer.clearLayers();
        labelsLayer.clearLayers();
        const zones = activeZones();
        const query = activeQuery();
        let bounds = null;
        data.nodes.forEach(node => {
          if (!zones.has(node.main_zone) || (query && !normalize(node.search_terms).includes(query))) {
            if (activeNodeId === node.id) activeNodeId = null;
            return;
          }
          const marker = nodeLayers[node.id];
          marker.addTo(nodesLayer);
          if (document.getElementById('toggleLabels').checked) nodeLabelLayers[node.id].addTo(labelsLayer);
          const p = L.latLng(node.lat, node.lon);
          bounds = bounds ? bounds.extend(p) : L.latLngBounds([p], [p]);
        });
        document.getElementById('visibleNodeCount').textContent = data.nodes.filter(node => zones.has(node.main_zone) && (!query || normalize(node.search_terms).includes(query))).length;
        document.getElementById('totalNodeCount').textContent = data.nodes.length;
        const totalCoverage = Object.keys(metaById).length;
        document.getElementById('coverageCount').textContent = totalCoverage;
        const coverageBounds = renderCoverage();
        if (fit) {
          const target = coverageBounds && coverageBounds.isValid() ? coverageBounds : bounds;
          if (target && target.isValid()) map.fitBounds(target.pad(0.08));
        }
      }

      data.nodes.forEach(node => {
        const marker = L.marker([node.lat, node.lon], { icon: radarIcon(zoneColors[node.main_zone] || '#8b97a5'), zIndexOffset: 900 });
        marker.on('click', e => {
          if (e.originalEvent) L.DomEvent.stopPropagation(e.originalEvent);
          activeNodeId = activeNodeId === node.id ? null : node.id;
          refresh(false);
        });
        nodeLayers[node.id] = marker;
        nodeLabelLayers[node.id] = L.tooltip({ permanent: true, direction: 'top', offset: [0,-14], className: 'city-label' }).setLatLng([node.lat, node.lon]).setContent(node.code);
      });

      document.querySelectorAll('input[data-zone], #toggleLabels').forEach(el => el.addEventListener('change', () => refresh(false)));
      document.getElementById('searchInput').addEventListener('input', () => refresh(false));
      document.getElementById('resetViewBtn').addEventListener('click', () => refresh(true));
      document.getElementById('copyDetailBtn').addEventListener('click', async () => {
        const text = buildCopyText();
        try {
          await navigator.clipboard.writeText(text);
          document.getElementById('copyDetailBtn').textContent = '已复制';
          setTimeout(() => { document.getElementById('copyDetailBtn').textContent = '复制详情'; }, 1200);
        } catch (err) {
          document.getElementById('copyDetailBtn').textContent = '复制失败';
          setTimeout(() => { document.getElementById('copyDetailBtn').textContent = '复制详情'; }, 1200);
        }
      });
      map.on('click', () => {
        if (activeNodeId) {
          activeNodeId = null;
          refresh(false);
        }
      });
      refresh(true);
    }).catch(err => {
      document.getElementById('detailCard').innerHTML = `<h3>加载失败</h3><div class="detail-row">${err.message || err}</div>`;
    });
  </script>
</body>
</html>

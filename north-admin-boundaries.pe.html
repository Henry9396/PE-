<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北部四大区行政地图- PE</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--bg:#eef3f7;--paper:#fff;--ink:#12283f;--muted:#66788c;--line:#d7e1ea;--soft:#f5f8fb;--shadow:0 16px 34px rgba(16,37,61,.10)}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f7fafc 0,#edf3f7 100%);color:var(--ink)}
    .shell{height:100vh;display:grid;grid-template-rows:auto 1fr}.topbar{padding:10px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
    .titlebox{padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:0 6px 16px rgba(16,37,61,.05)}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .page-title{margin:5px 0 2px;font-size:24px;line-height:1.08}.page-subtitle{margin:0;font-size:12px;line-height:1.35;color:var(--muted)}
    .main{position:relative;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 320px;gap:10px;padding:10px}.side,.map-card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
    .side{display:grid;gap:10px;align-content:start;overflow:auto;padding:10px}.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;min-height:42px;border:1px solid var(--line);border-radius:14px;background:#fff}.group strong{font-size:12px}.group label{font-size:12px;color:#31465b;display:inline-flex;align-items:center;gap:6px}.group button{border:1px solid #cfd9e3;background:#fff;color:var(--ink);border-radius:10px;padding:6px 11px;font-size:12px;cursor:pointer}.group button.active{background:#17344c;color:#fff;border-color:#17344c}
    .legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.legend-item{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.swatch{width:12px;height:12px;border-radius:4px;display:inline-block}
    .search input{flex:1 1 150px;min-width:120px;border:1px solid #cfd9e3;border-radius:10px;padding:7px 9px;font-size:12px;color:var(--ink);background:#fff}.heat-legend{display:grid;gap:7px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}.heat-title{font-size:12px;font-weight:800}.heat-gradient{height:12px;border-radius:999px;background:linear-gradient(90deg,#fff7bc,#fec44f,#fe9929,#ec7014,#cc4c02,#8c2d04);border:1px solid #ead9aa}.heat-scale{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:0 6px 16px rgba(16,37,61,.05)}.stat .k{font-size:11px;color:var(--muted)}.stat .v{margin-top:2px;font-size:18px;font-weight:800}
    #map{height:100%;min-height:0}.panel-head{padding:12px 14px 10px;border-bottom:1px solid #e5edf3}.panel-head h2{margin:0;font-size:16px}.panel-head p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.5}.panel-body{padding:12px;overflow:auto;max-height:calc(100vh - 180px);background:#f8fbfd}.detail-card{padding:12px;border:1px solid #dce5ee;border-radius:16px;background:#fff;margin-bottom:10px}.detail-card h3{margin:0 0 8px;font-size:15px}.detail-row,.selected-meta{font-size:12px;color:#41576c;line-height:1.55}.panel-tools{display:flex;gap:8px;margin-bottom:10px}.panel-tools button{border:1px solid #cfd9e3;background:#fff;color:var(--ink);border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer}.selected-list{display:grid;gap:8px}.selected-item{position:relative;padding:10px 34px 10px 11px;border:1px solid #dce5ee;border-radius:14px;background:#fff}.selected-item strong{display:block;font-size:13px;margin-bottom:4px}.remove-selected{position:absolute;top:8px;right:8px;width:22px;height:22px;border:1px solid #d7e1ea;border-radius:8px;background:#fff;color:#607287;cursor:pointer;line-height:18px}
    .toast{position:absolute;left:50%;bottom:18px;z-index:900;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;padding:8px 12px;border-radius:12px;background:rgba(18,40,63,.92);color:#fff;font-size:12px;transition:.18s ease}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.area-label{background:rgba(255,255,255,.92);color:#10263f;border:1px solid #d7e1ea;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.10);font-size:11px;font-weight:700;padding:2px 6px}.area-label::before{display:none}.loading{position:absolute;inset:10px;display:grid;place-items:center;background:rgba(255,255,255,.72);z-index:1000;border-radius:18px;color:#31465b;font-size:13px;font-weight:700}
    @media(max-width:1120px){.main{grid-template-columns:1fr;grid-template-rows:auto minmax(520px,1fr) auto;overflow:auto}.side{display:grid}.map-card{min-height:520px}}@media(max-width:760px){.topbar{padding:8px}.page-title{font-size:22px}.main{padding:8px;gap:8px}.map-card,.panel,.side{border-radius:18px}#map{min-height:64vh;height:64vh}.panel{max-height:34vh}.panel-body{max-height:calc(34vh - 64px)}}
  </style>
</head>
<body>
<div class="shell"><div class="topbar"><div class="titlebox"><div class="eyebrow">North Peru Admin Map</div><h1 class="page-title">北部四大区行政地图- PE</h1><p class="page-subtitle">北部四大区行政边界选择工具，默认按区级人口热力显示；点击区域加入已选清单。</p></div></div>
<div class="main"><aside class="side"><div class="legend"><span class="legend-item"><i class="swatch" style="background:#d95c39"></i>La Libertad</span><span class="legend-item"><i class="swatch" style="background:#d89c2b"></i>Piura</span><span class="legend-item"><i class="swatch" style="background:#5a9e6f"></i>Lambayeque</span><span class="legend-item"><i class="swatch" style="background:#4485c7"></i>Tumbes</span></div><div class="group" id="deptFilters"></div><div class="group"><strong>选择粒度</strong><label><input type="radio" name="level" class="level-filter" value="departments">大区</label><label><input type="radio" name="level" class="level-filter" value="provinces">省</label><label><input type="radio" name="level" class="level-filter" value="districts" checked>区</label></div><div class="group"><strong>显示模式</strong><label><input type="radio" name="mode" class="mode-filter" value="population" checked>人口热力</label><label><input type="radio" name="mode" class="mode-filter" value="admin">行政颜色</label></div><div class="group search"><strong>搜索</strong><input type="search" id="searchInput" list="areaOptions" placeholder="输入名称或 UBIGEO"><datalist id="areaOptions"></datalist><button id="searchBtn">定位</button></div><div class="group"><strong>显示</strong><label><input type="checkbox" id="toggleBorders" checked>边界线</label><label><input type="checkbox" id="toggleLabels">名称</label><button id="fitBtn">重置视图</button></div><div class="group"><strong>底图</strong><button class="basemap-btn active" data-basemap="roads">公路底图</button><button class="basemap-btn" data-basemap="light">简洁底图</button></div><div class="heat-legend" id="heatLegend"><div class="heat-title">人口热力</div><div class="heat-gradient"></div><div class="heat-scale"><span id="heatMin">低</span><span id="heatMax">高</span></div></div><div class="stats"><div class="stat"><div class="k">大区</div><div class="v">4</div></div><div class="stat"><div class="k">省</div><div class="v">26</div></div><div class="stat"><div class="k">区</div><div class="v">199</div></div><div class="stat"><div class="k">当前层级</div><div class="v" id="currentLevel">区</div></div></div></aside><section class="map-card"><div id="map"></div></section><div class="toast" id="toast"></div><div class="loading" id="loading">正在加载行政边界数据...</div><aside class="panel"><div class="panel-head"><h2>行政区详情</h2><p>点击地图中的大区、省或区可高亮并加入右侧列表；支持多选、复制和清空。</p></div><div class="panel-body"><div class="detail-card" id="detailCard"><h3>未选择</h3><div class="detail-row">点击地图中的行政区查看名称、层级、所属上级和编码。</div></div><div class="panel-tools"><button id="copySelectedBtn">复制已选</button><button id="clearSelectedBtn">清空已选</button></div><div class="detail-card"><h3>已选行政区</h3><div class="selected-list" id="selectedList"><div class="detail-row">当前还没有选中的行政区。</div></div></div></div></aside></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA_SOURCE='https://raw.githubusercontent.com/Henry9396/PE-/77416002427645974259857e708f200069f3268c/north-admin-boundaries.pe.html';
const colors={"LA LIBERTAD":"#d95c39","PIURA":"#d89c2b","LAMBAYEQUE":"#5a9e6f","TUMBES":"#4485c7"};
const levelOrder=['departments','provinces','districts'];const levelText={departments:'大区',provinces:'省',districts:'区'};const heatColors=['#fff7bc','#fec44f','#fe9929','#ec7014','#cc4c02','#8c2d04'];let payload=null;let searchIndex=[];let selectedFeatures=new Map();let populationBreaks={};
const map=L.map('map',{zoomControl:true}).setView([-7.2,-79.2],7);const roadBase=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);const lightBase=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'&copy; OpenStreetMap &copy; CARTO'});const drawnLayer=L.layerGroup().addTo(map);const labelLayer=L.layerGroup().addTo(map);
const deptNames=Object.keys(colors);document.getElementById('deptFilters').innerHTML='<strong>大区</strong>'+deptNames.map(n=>`<label><input type="checkbox" class="dept-filter" value="${n}" checked>${n}</label>`).join('');
function titleName(t){return(t||'').toLowerCase().replace(/(^|\s|\/|-)([a-záéíóúñ])/g,(_,a,b)=>a+b.toUpperCase())}function activeDepartments(){return new Set(Array.from(document.querySelectorAll('.dept-filter:checked')).map(e=>e.value))}function activeLevels(){return[document.querySelector('.level-filter:checked')?.value||'districts']}function activeDisplayMode(){return document.querySelector('.mode-filter:checked')?.value||'population'}function featureKey(l,p){return`${l}:${p.fid}`}function levelLabel(l){return levelText[l]||l}function featureName(l,p){return l==='departments'?titleName(p.nombdep):l==='provinces'?titleName(p.nombprov):titleName(p.nombdist)}function fmt(v){v=Number(v||0);return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'k':v.toLocaleString('en-US')}function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),1400)}
function featureMeta(l,p){const pop=['人口',(p.population||0).toLocaleString('en-US')];if(l==='departments')return{title:titleName(p.nombdep),key:featureKey(l,p),rows:[['层级','大区'],['代码',p.ccdd],pop,['覆盖网点',p.network_node_summary_cn||'未匹配']]};if(l==='provinces')return{title:titleName(p.nombprov),key:featureKey(l,p),rows:[['层级','省'],['所属大区',titleName(p.nombdep)],['省代码',`${p.ccdd}${p.ccpp}`],pop,['覆盖网点',p.network_node_summary_cn||'未匹配']]};return{title:titleName(p.nombdist),key:featureKey(l,p),rows:[['层级','区'],['所属省',titleName(p.nombprov)],['所属大区',titleName(p.nombdep)],['UBIGEO',p.ubigeo],pop,['所属网点',p.network_node_cn||'未匹配']]}}
function buildBreaks(){populationBreaks={};levelOrder.forEach(l=>{const vals=payload[l].features.map(f=>Number(f.properties.population||0)).filter(Boolean).sort((a,b)=>a-b);const q=r=>vals[Math.min(vals.length-1,Math.max(0,Math.floor((vals.length-1)*r)))]||0;populationBreaks[l]={min:vals[0]||0,max:vals.at(-1)||0,steps:[0,.2,.4,.6,.8,.93].map(q)}})}function heatColor(l,pop){const v=Number(pop||0),steps=populationBreaks[l]?.steps||[];if(!v)return'#f2f4f7';let i=0;for(let n=1;n<steps.length;n++)if(v>=steps[n])i=n;return heatColors[Math.min(i,heatColors.length-1)]}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}function mix(hex,ratio){const s=hex.replace('#',''),r=parseInt(s.slice(0,2),16),g=parseInt(s.slice(2,4),16),b=parseInt(s.slice(4,6),16),t=clamp(ratio,0,1);return'#'+[r+(255-r)*t,g+(255-g)*t,b+(255-b)*t].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('')}function adminFill(l,p){if(l==='provinces')return mix(colors[p.nombdep]||'#8492a6',.34);return colors[p.nombdep]||'#8492a6'}
function styleFor(l,p,sel){const heat=activeDisplayMode()==='population',show=document.getElementById('toggleBorders').checked;const base={color:show?(l==='departments'?'#1f3042':l==='provinces'?'#000':'#d97a2b'):'transparent',weight:show?(l==='departments'?3:l==='provinces'?2.2:.8):0,opacity:1,fillColor:heat?heatColor(l,p.population):adminFill(l,p),fillOpacity:heat?.72:(l==='departments'?.5:l==='provinces'?.36:.03)};if(sel){base.color='#d63b2d';base.weight=4;base.fillOpacity=Math.min(base.fillOpacity+.18,.72)}return base}
function setDetail(l,p){const m=featureMeta(l,p);document.getElementById('detailCard').innerHTML=`<h3>${m.title}</h3>`+m.rows.map(r=>`<div class="detail-row">${r[0]}：${r[1]}</div>`).join('')}function updateSelectedList(){const list=document.getElementById('selectedList'),items=Array.from(selectedFeatures.values()).sort((a,b)=>levelOrder.indexOf(a.level)-levelOrder.indexOf(b.level)||a.title.localeCompare(b.title));if(!items.length){list.innerHTML='<div class="detail-row">当前还没有选中的行政区。</div>';return}list.innerHTML=items.map(it=>`<div class="selected-item" data-key="${featureKey(it.level,it.props)}"><button class="remove-selected" aria-label="移除">×</button><strong>${it.title}</strong><div class="selected-meta">层级：${levelLabel(it.level)}</div>${it.level!=='departments'?`<div class="selected-meta">所属大区：${titleName(it.props.nombdep)}</div>`:''}${it.level==='districts'?`<div class="selected-meta">所属省：${titleName(it.props.nombprov)}</div>`:''}<div class="selected-meta">${it.level==='districts'?`UBIGEO：${it.props.ubigeo}`:it.level==='provinces'?`省代码：${it.props.ccdd}${it.props.ccpp}`:`代码：${it.props.ccdd}`}</div><div class="selected-meta">人口：${(it.props.population||0).toLocaleString('en-US')}</div></div>`).join('');list.querySelectorAll('.remove-selected').forEach(btn=>btn.onclick=e=>{selectedFeatures.delete(e.currentTarget.closest('.selected-item').dataset.key);refreshMap(false)})}
function selectedText(){return Array.from(selectedFeatures.values()).map(it=>`${it.title}\n层级：${levelLabel(it.level)}\n人口：${(it.props.population||0).toLocaleString('en-US')}`).join('\n\n')}function updateHeatLegend(levels){const box=document.getElementById('heatLegend'),heat=activeDisplayMode()==='population';box.style.display=heat?'grid':'none';if(!heat)return;const r=populationBreaks[levels[0]];document.getElementById('heatMin').textContent=fmt(r.min);document.getElementById('heatMax').textContent=fmt(r.max)}
function refreshMap(fit=false){drawnLayer.clearLayers();labelLayer.clearLayers();const depts=activeDepartments(),labels=document.getElementById('toggleLabels').checked,levels=activeLevels();let bounds=null;levels.forEach(l=>L.geoJSON(payload[l],{filter:f=>depts.has(f.properties.nombdep),style:f=>styleFor(l,f.properties,selectedFeatures.has(featureKey(l,f.properties))),onEachFeature:(f,layer)=>{const p=f.properties,m=featureMeta(l,p),key=featureKey(l,p),sel=selectedFeatures.has(key);layer.bindPopup(`<div style="font-weight:700;margin-bottom:6px;">${m.title}</div>`+m.rows.map(r=>`<div style="font-size:12px;line-height:1.5;">${r[0]}：${r[1]}</div>`).join(''));layer.on('click',()=>{selectedFeatures.has(key)?(selectedFeatures.delete(key),showToast(`已取消：${m.title}`)):(selectedFeatures.set(key,{level:l,title:m.title,props:p}),showToast(`已选择：${m.title}`));setDetail(l,p);refreshMap(false)});layer.on('mouseover',()=>layer.setStyle(styleFor(l,p,true)));layer.on('mouseout',()=>{if(!selectedFeatures.has(key))layer.setStyle(styleFor(l,p,false))});if(labels&&(!selectedFeatures.size||sel))L.tooltip({permanent:true,direction:'center',className:'area-label'}).setContent(featureName(l,p)).setLatLng(layer.getBounds().getCenter()).addTo(labelLayer);drawnLayer.addLayer(layer);bounds=bounds?bounds.extend(layer.getBounds()):layer.getBounds()}}));document.getElementById('currentLevel').textContent=levels.map(levelLabel).join('+');updateHeatLegend(levels);updateSelectedList();if(fit&&bounds?.isValid())map.fitBounds(bounds.pad(.04))}
function buildSearch(){searchIndex=[];levelOrder.forEach(l=>payload[l].features.forEach(f=>{const p=f.properties,m=featureMeta(l,p);searchIndex.push({level:l,title:m.title,props:p,bbox:f.bbox,text:[m.title,p.nombdep,p.nombprov,p.nombdist,p.ubigeo,`${p.ccdd||''}${p.ccpp||''}`].filter(Boolean).join(' ').toLowerCase()})}));document.getElementById('areaOptions').innerHTML=searchIndex.map(i=>`<option value="${i.title}">${levelLabel(i.level)} · ${i.props.ubigeo||`${i.props.ccdd}${i.props.ccpp||''}`}</option>`).join('')}function selectSearch(){const raw=document.getElementById('searchInput').value.trim().toLowerCase();if(!raw)return;const item=searchIndex.find(i=>i.text.includes(raw));if(!item){showToast('没有找到匹配行政区');return}document.querySelectorAll('.level-filter').forEach(e=>e.checked=e.value===item.level);document.querySelectorAll('.dept-filter').forEach(e=>e.checked=e.value===item.props.nombdep);selectedFeatures.set(featureKey(item.level,item.props),{level:item.level,title:item.title,props:item.props});setDetail(item.level,item.props);refreshMap(false);if(item.bbox)map.fitBounds([[item.bbox[1],item.bbox[0]],[item.bbox[3],item.bbox[2]]],{padding:[28,28]});showToast(`已定位：${item.title}`)}
async function loadPayload(){const html=await fetch(DATA_SOURCE).then(r=>{if(!r.ok)throw new Error('数据源加载失败');return r.text()});const match=html.match(/const payload = ([\s\S]*?);\n    const colors = /);if(!match)throw new Error('数据源格式不匹配');payload=JSON.parse(match[1]);buildBreaks();buildSearch();refreshMap(true);document.getElementById('loading').style.display='none'}
document.querySelectorAll('.level-filter,.mode-filter').forEach(e=>e.onchange=()=>refreshMap(e.classList.contains('level-filter')));document.getElementById('toggleBorders').onchange=()=>refreshMap(false);document.getElementById('toggleLabels').onchange=()=>refreshMap(false);document.getElementById('fitBtn').onclick=()=>refreshMap(true);document.getElementById('searchBtn').onclick=selectSearch;document.getElementById('searchInput').onkeydown=e=>{if(e.key==='Enter')selectSearch()};document.getElementById('copySelectedBtn').onclick=async()=>{const t=selectedText();if(t)await navigator.clipboard.writeText(t)};document.getElementById('clearSelectedBtn').onclick=()=>{selectedFeatures.clear();refreshMap(false)};document.querySelectorAll('.basemap-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.basemap-btn').forEach(b=>b.classList.toggle('active',b===btn));if(btn.dataset.basemap==='roads'){map.removeLayer(lightBase);roadBase.addTo(map)}else{map.removeLayer(roadBase);lightBase.addTo(map)}});document.querySelectorAll('.dept-filter').forEach(e=>e.onchange=()=>refreshMap(true));
loadPayload().catch(err=>{document.getElementById('loading').textContent='加载失败：'+err.message;console.error(err)});
</script>
</body>
</html>
